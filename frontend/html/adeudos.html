<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de contratos con adeudos</title>
  <link rel="stylesheet" href="../css/adeudos.css">
</head>
<body>

<header class="topbar">
  <h1>Lista de contratos con adeudos</h1>

  <button class="menu-btn" id="menu">
    <i class="fa-solid fa-house"></i> Menú
  </button>
</header>

<section class="actions">

  <button id="buscar">Buscar</button>

  <button id="descargar">Descargar</button>

  <button id="limpiar">Limpiar</button>

  <button class="btn" id="regresar">
    <i class="fa-solid fa-arrow-left"></i> Regresar
  </button>

</section>

<section class="filters">

  <div>
    <label>Fecha de corte</label>
    <input type="date" id="fechaCorte">
  </div>

  <div>
    <label>Calle</label>

    <select id="calle">
      <option value="">Seleccione</option>
    </select>

  </div>

</section>

<p class="info" id="infoRegistros">
  Existen 11166 registros en total
</p>

<div class="pagination">
  <button>&lt;</button>
  <span class="active">1</span>
  <span>2</span>
  <span>3</span>
  <span>4</span>
  <span>5</span>
  <span>...</span>
  <span>193</span>
  <button>&gt;</button>
</div>

<div class="table-container">
<table>
  <thead>
    <tr>
      <th>Contrato</th>
      <th>Contrato anterior</th>
      <th>Nombre</th>
      <th>Domicilio propietario</th>
      <th>Domicilio contrato</th>
      <th>Tipo toma</th>
      <th>Mes inicio</th>
      <th>Mes actual</th>
      <th>Meses pendientes</th>
      <th>Cuota</th>
      <th>Recargos</th>
      <th>Total recargos</th>
      <th>Importe agua</th>
      <th>Total a pagar</th>
    </tr>
  </thead>
  <tbody id="tabla-body"></tbody>
</table>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../js/adeudos.js"></script>
</body>
</html>
