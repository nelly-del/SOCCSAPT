<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de contratos con adeudos</title>
  <link rel="stylesheet" href="../css/adeudos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  
</head>
<body>

<header class="topbar">
  <h1>Lista de contratos con adeudos</h1>
  <button class="menu-btn" id="menu">
    <i class="fa-solid fa-house"></i> Menú
  </button>
</header>

<section class="actions">
  <button id="buscar">Buscar</button>
  <button id="descargar">Descargar</button>
  <button id="limpiar">Limpiar</button>
  <button class="btn" id="regresar">
    <i class="fa-solid fa-arrow-left"></i> Regresar
  </button>
</section>

<section class="filters">
  <div>
    <label>Fecha de corte</label>
    <input type="date" id="fechaCorte">
  </div>
  <div>
    <label>Calle / Domicilio</label>
    <select id="calle">
      <option value="">Seleccione</option>
    </select>
  </div>
</section>

<p class="info" id="infoRegistros">Cargando registros...</p>


<div class="table-container">
<table>
  <thead>
    <tr>
      <th>Contrato</th>
      <th>Nombre</th>
      <th>Domicilio propietario</th>
      <th>Domicilio contrato</th>
      <th>Tipo toma</th>
      <th>Mes inicio</th>
      <th>Mes actual</th>
      <th>Meses pendientes</th>
      <th>Cuota</th>
      <th>Recargos</th>
      <th>Total recargos</th>
      <th>Importe agua</th>
      <th>Total a pagar</th>
    </tr>
  </thead>
  <tbody id="tabla-body"></tbody>
</table>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../js/adeudos.js"></script>
</body>
</html>
