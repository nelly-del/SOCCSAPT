<!-- contratos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Listado de contratos</title>

  <link rel="stylesheet" href="../css/contratos.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- HEADER -->
<div class="header">

  <h2>Listado de contratos</h2>

  <div class="menu">

    <button class="btn-menu" id="menu">
      <i class="fa-solid fa-house"></i> Menú
    </button>

    <button class="btn-menu" id="contribuyentes">
      <i class="fa-solid fa-users"></i> Contribuyentes
    </button>

    <button class="btn-menu" id="pagos">
      <i class="fa-solid fa-coins"></i> Pagos
    </button>

    <button class="btn-menu" id="reportes">
      <i class="fa-solid fa-chart-column"></i> Reportes
    </button>

  </div>

</div>

<!-- BARRA -->
<div class="barra">

  <div class="acciones">

    <button class="btn" id="agregarcontrato">
      <i class="fa-solid fa-circle-plus"></i> Agregar Contrato
    </button>

    <button class="btn" id="cancelar">
      <i class="fa-solid fa-circle-xmark"></i> Cancelar contrato
    </button>

    <button class="btn">
      <i class="fa-solid fa-pen-to-square"></i> Editar contrato
    </button>

    <button class="btn" id="excel">
      <i class="fa-solid fa-download"></i> Descargar
    </button>

    <button class="btn">
      <i class="fa-solid fa-hand-holding-droplet"></i>
      Pagar servicio de agua
    </button>

  </div>

  <!-- BUSCADOR -->
  <div class="buscador">

    <input type="text" id="buscar" placeholder="Buscar">

    <i class="fa-solid fa-magnifying-glass"></i>

  </div>

</div>

<!-- INFO -->
<p class="info" id="infoRegistros">
  Cargando contratos...
</p>

<!-- TABLA -->
<div class="tabla-container">

<table>

<thead>
<tr>

  <th>Contrato</th>
  <th>Codigo</th>
  <th>Contribuyente</th>
  <th>Último pago</th>
  <th>Pago inicio</th>
  <th>Creacion del contrato</th>
  <th>Contrato anterior</th>
  <th>Unidad</th>
  <th>Estatus</th>
  <th>Bomba</th>
  <th>Tipo de uso</th>

</tr>
</thead>

<tbody id="tablaContratos">

</tbody>

</table>

</div>

<!-- PAGINACION -->
<div class="paginacion"></div>


<script src="../js/contratos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
<!-- MODAL CANCELAR CONTRATO -->
<div id="modalCancelar" class="modal">

  <div class="modal-content modal-grande">

    <h2>Cancelar contrato</h2>

    <div class="infoContrato">

      <p>
        <strong>Contrato:</strong>
        <span id="modalContrato"></span>
      </p>

      <p>
        <strong>Contribuyente:</strong>
        <span id="modalNombre"></span>
      </p>

      <p>
        <strong>Estatus:</strong>
        <span id="modalEstatus"></span>
      </p>

      <p>
        <strong>Adeudos:</strong>

        <span id="modalAdeudos"
        class="sinAdeudos">

        Sin adeudos

        </span>

      </p>

    </div>

    <div class="grupo">

      <label>
        Motivo de cancelación
      </label>

      <textarea
      id="motivoCancelacion"
      rows="4"
      placeholder="Escribe el motivo de cancelación">
      </textarea>

    </div>

    <div class="accionesModal">

      <button
      class="btn-cancelar"
      onclick="cerrarModalCancelar()">

      Cancelar

      </button>

      <button
      class="btn-confirmar"
      id="confirmarCancelacion">

      Confirmar cancelación

      </button>

    </div>

  </div>

</div>
</html>
