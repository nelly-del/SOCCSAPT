<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pagos</title>

<link rel="stylesheet" href="../css/pagos.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
rel="stylesheet">


</head>
<body>

<header class="topbar">

    <h1>Listado de pagos</h1>

    <div class="menu-superior">

        <button id="btnMenu">
            <i class="fa-solid fa-house"></i>
            Menú
        </button>

        <button id="btnContratos">
            <i class="fa-solid fa-file-contract"></i>
            Contratos
        </button>

        <!--<button id="btnPagos">
            <i class="fa-solid fa-money-bill"></i>
            Pagos
        </button>
    -->
        <button id="btnReportes">
            <i class="fa-solid fa-chart-column"></i>
            Reportes
        </button>

    </div>

</header>

<div class="barra-acciones">

    <button id="btnVer">
        <i class="fa-regular fa-eye"></i> Ver
    </button>

    <button id="btnDescargar">
        <i class="fa-solid fa-download"></i> Descargar
    </button>

    <!--<button id="btnCancelar">
        <i class="fa-solid fa-circle-xmark"></i> Cancelar
    </button>-->

    <button id="btnImprimir">
        <i class="fa-solid fa-print"></i> Imprimir
    </button>

    <button id="btnRecibos">
        <i class="fa-solid fa-receipt"></i> Recibos
    </button>

    <button id="btnLimpiar">
        <i class="fa-solid fa-broom"></i> Limpiar
    </button>

</div>

<div class="filtros">

    <div class="campo">
        <label>Fecha inicio</label>
        <input type="date" id="fechaInicio">
    </div>

    <div class="campo">
        <label>Fecha final</label>
        <input type="date" id="fechaFin">
    </div>

    <div class="campo">
        <label>Contrato</label>
        <select id="filtroContrato">
            <option value="">Seleccione</option>
        </select>
    </div>

    <div class="campo">
        <label>Contribuyente</label>
        <select id="filtroContribuyente">
            <option value="">Seleccione</option>
        </select>
    </div>

    <div class="campo">
        <label>Servicio</label>
        <select id="filtroServicio">
            <option value="">Seleccione</option>
        </select>
    </div>

</div>

<div class="checks">

    <!--<label>
        <input type="checkbox" id="chkNoTimbrados">
        No timbrados
    </label>-->

    <label>
        <input type="checkbox" id="chkVigentes">
        Vigentes
    </label>

</div>

<p id="totalRegistros">
 Existen 0 registros en total
</p>

<div class="paginacion">

    <button id="btnAnterior">&lt;</button>

    <span id="pagina1">1</span>
    <span id="pagina2">2</span>
    <span id="pagina3">3</span>
    <span id="pagina4">4</span>

    <button id="btnSiguiente">&gt;</button>

</div>

<div class="contenedor-tabla">

<table>

<thead>

<tr>

<th>Folio</th>
<th>Contrato</th>
<th>Contribuyente</th>
<th>Servicio</th>
<th>Mes Inicio</th>
<th>Mes Fin</th>
<th>Meses</th>
<th>Fecha Pago</th>
<th>Cajero</th>
<th>Recargos</th>
<th>Descuentos</th>
<th>Importe</th>
<th>Estatus</th>
<th>Timbrado</th>

</tr>

</thead>

<tbody id="tablaPagos"></tbody>

</table>

</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="../js/pagos.js"></script>

</body>
</html>
